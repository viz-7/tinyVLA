[project]
name = "tinyvla"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vishnu", email = "SnowSneeze@protonmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mani-skill>=3.0.1",
    "numpy==1.26.4",
    "torch==2.14.0+cu126",
    "torchvision==0.29.0+cu126",
]

[project.scripts]
tinyvla = "tinyvla:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
